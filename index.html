<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/standard.css" />
    <link rel="stylesheet" href="styles/assets.css" />
    <link rel="stylesheet" href="styles/fonts.css" />
    <script src="script.js" defer></script>
    <script src="scripts/template.js"></script>
    <script src="scripts/db.js"></script>
    <script src="scripts/apiKeys.js"></script>
  </head>
  <body onload="renderPokemones()">
    <header>
      <section>
        <div class="content">here is Header</div>
      </section>
    </header>
    <main>
      <article>
        <div id="content" class="content"></div>
      </article>

      <article>
        <dialog closedby="any" id="pokemon-dialog" class="pokemon-dialog">
          <div class="content">
            <div class="head-content">
              <h2 class="roboto-bold">Balbsaur</h2>
              <div class="types-img">
                <div class="types">
                  <p>fire</p>
                  <p>water</p>
                </div>
                <img src="assets/img/bulbasaur.png" alt="bulbasaur" />
              </div>
            </div>
            <div class="main-content">
this is main content
            </div>
          </div>
        </dialog>
      </article>

      <section id="pagination" class="pagination roboto-bold">
        <div class="content">
          <button id="btn-back" onclick="backward()">Back</button>
          <p id="pagination-content"></p>
          <button id="bnt-next" onclick="forward()">Next</button>
        </div>
      </section>
    </main>
    <footer>
      <section>
        <div class="content">here is footer</div>
      </section>
    </footer>
  </body>
</html>
